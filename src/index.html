<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esp32 control</title>
    <style>
* {
    background-color: rgb(29, 29, 29);
}

.control-container {
    background-color: cadetblue;
    padding: 40px 40px;
    border-radius: 25px;
    width: 300px;
    height: max-content;
    text-align: center;
    margin-left: auto;
    margin-right: auto;
}
.control-container {
    font-size: 40px;
    color: aliceblue;
    font-weight: bold;
    font-family: monospace;
}

button {
    display: block;
    padding: 5px 50px;
    margin: 10px auto;
    font-size: 45px;
    font-weight: bold;
    color: aliceblue;
    background-color: black;
    border: none;
    border-radius: 15px;
    cursor: pointer;

}
button:hover{
    background-color: #2B3032;
}
    </style>
</head>
<body>
    <div class="control-container">
    <h1>Esp32 Led Blink</h1>
    <button onclick="toggleLED('on')">Turn ON</button>
    <button onclick="toggleLED('off')">Turn OFF</button>
    <h1>Auto blink</h1>
    <input type="text" id="fetchTime" placeholder="Enter auto-work time">
    <button onclick="getWorkTime()">Start</button> 
    </div>

    <script>
        const toggleLED = (state) => {
            fetch('/' + state)
                .then(response => response.text())
                .catch(err => console.error(err));
        }

        const getWorkTime = () => {
            const val = document.getElementById('fetchTime').value;
            fetch('/getTime?text=' + encodeURIComponent(val))
                .then(response => response.text())
                .catch(err => console.error(err))
        }
    </script>
</body>
</html>
